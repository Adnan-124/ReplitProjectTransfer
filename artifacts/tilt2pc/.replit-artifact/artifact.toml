kind = "mobile"
previewPath = "/"
title = "Tilt2PC Controller"
version = "1.0.0"
id = "artifacts/tilt2pc"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 20116

[services.development]
run = "pnpm --filter @workspace/tilt2pc run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tilt2pc", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/tilt2pc", "run", "serve" ]

[services.env]
PORT = "20116"
BASE_PATH = "/"
